<title>The Blacktop Lodge</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; padding:0 20px; font:17px/1.6 Georgia,'Times New Roman',serif;
         color:#1a1a1a; background:#fffdf9;
         display:flex; min-height:100vh; align-items:center; justify-content:center; }

       text-transform:uppercase; margin:0 0 2.2rem; }

          border-radius:2px; background:transparent; color:inherit; width:14em;

const un64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  if (!window.crypto || !crypto.subtle) {
    document.getElementById('e').textContent =
      'Use the https:// address \u2014 this page can\u2019t unlock over plain http.';
    return;
  }
  const pw = document.getElementById('p').value;
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:un64(SALT), iterations:ITER, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:un64(NONCE)}, key, un64(CT));
    document.open(); document.write(new TextDecoder().decode(pt)); document.close();
  } catch (e) {
    document.getElementById('e').textContent = 'That\u2019s not it.';
    document.getElementById('p').value = '';
  }
});
