<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>The Blacktop Lodge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --obsidian:#0a0a0a; --gold:#c9a84c; --gold-dim:#8a7034;
    --gold-glow:rgba(201,168,76,0.08); --bone:#e8e0d0; --bone-dim:#9a9286;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--obsidian); color:var(--bone);
    font:300 16px/1.7 'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:0 24px;
  }
  main {
    text-align:center; animation:emerge 1.2s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes emerge {
    from { opacity:0; transform:translateY(14px); filter:blur(2px); }
    to   { opacity:1; transform:none; filter:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *,*::before,*::after { animation-duration:1ms !important; transition-duration:1ms !important; }
  }
  .sigil { width:64px; height:64px; margin:0 auto 2rem; animation:sigilPulse 3.5s ease-in-out infinite; }
  @keyframes sigilPulse { 0%,100% { opacity:0.3; } 50% { opacity:0.8; } }
  h1 {
    font:400 1.6rem/1.2 'Cormorant Garamond',Georgia,serif;
    text-transform:uppercase; letter-spacing:0.16em; color:var(--gold);
    margin:0 0 2.4rem;
  }
  input {
    font:300 1rem/1 'Inter',sans-serif; letter-spacing:0.08em;
    padding:0.7em 1em; width:15em; text-align:center;
    color:var(--bone); background:transparent;
    border:1px solid var(--gold-dim); border-radius:2px;
    transition:border-color 0.6s ease, box-shadow 0.6s ease;
  }
  input:focus { outline:none; border-color:var(--gold); box-shadow:0 0 18px var(--gold-glow); }
  input::placeholder { color:var(--bone-dim); opacity:0.55; }
  .err {
    color:var(--bone-dim); font:italic 300 1rem/1.5 'Cormorant Garamond',Georgia,serif;
    min-height:1.6em; margin-top:1.3rem;
  }
</style>
</head>
<body>
<main>
  <svg class="sigil" viewBox="0 0 40 40" fill="none" aria-hidden="true">
    <circle cx="20" cy="20" r="18" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
    <circle cx="20" cy="20" r="12" stroke="#c9a84c" stroke-width="0.5" opacity="0.25"/>
    <path d="M20 10 Q30 20 20 30" stroke="#c9a84c" stroke-width="0.5" fill="none" opacity="0.4"/>
    <circle cx="20" cy="20" r="1.5" fill="#c9a84c" opacity="0.5"/>
  </svg>
  <h1>The Blacktop Lodge</h1>
  <form id="f">
    <input id="p" type="password" autocomplete="off" autofocus
           aria-label="passphrase" placeholder="passphrase">
  </form>
  <p class="err" id="e"></p>
</main>

  ev.preventDefault();
  if (!window.crypto || !crypto.subtle) {
    document.getElementById('e').textContent =
      'Use the https:// address — this page can’t unlock over plain http.';
    return;
  }
  const pw = document.getElementById('p').value;
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(

      km, {name:'AES-GCM', length:256}, false, ['decrypt']);

      {name:'AES-GCM', iv:un64(NONCE)}, key, un64(CT));
    document.open(); document.write(new TextDecoder().decode(pt)); document.close();
  } catch (e) {
    document.getElementById('e').textContent = 'That’s not it.';
    document.getElementById('p').value = '';
  }
});
